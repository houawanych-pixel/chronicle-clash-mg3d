name: Export Web Build

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export-web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Fetch private HOVAGI animation data (Mixamo-derived)
        uses: actions/checkout@v4
        with:
          repository: houawanych-pixel/hovagi-anim-private
          token: ${{ secrets.ANIM_REPO_TOKEN }}
          path: _anim_private
      - name: Copy clips.json into six_stage
        run: |
          mkdir -p six_stage/assets/anim
          cp _anim_private/assets/anim/clips.json six_stage/assets/anim/clips.json
          rm -rf _anim_private
          test -s six_stage/assets/anim/clips.json
      - name: Setup templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable
      - name: Export Web
        run: |
          mkdir -v -p build/web
          godot --headless --export-release "Web" build/web/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: export-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
