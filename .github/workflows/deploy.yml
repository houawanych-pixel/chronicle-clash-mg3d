name: Export Web Build

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export-web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Setup templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable
      - name: Export Web
        run: |
          mkdir -v -p build/web/play
          godot --headless --export-release "Web" build/web/play/index.html
      - name: Give the game pack a per-build name (phones never keep an old one)
        run: |
          V=$(echo "$GITHUB_SHA" | cut -c1-8)
          mv build/web/play/index.pck "build/web/play/index.$V.pck"
          sed -i "s/\"index.pck\":/\"index.$V.pck\":/; s/\"executable\":\"index\"/\"executable\":\"index\",\"mainPack\":\"index.$V.pck\"/" build/web/play/index.html
          grep -o "mainPack[^,]*" build/web/play/index.html
      - name: Add the homepage (site/ at the root, the game stays under /play/)
        run: |
          cp -r site/. build/web/
          rm -f build/web/.gdignore
          sed -i "s/site.css\"/site.css?v=$(echo "$GITHUB_SHA" | cut -c1-8)\"/; s/site.js\"/site.js?v=$(echo "$GITHUB_SHA" | cut -c1-8)\"/" build/web/index.html
          ls build/web build/web/play
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: export-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
